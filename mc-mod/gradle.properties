# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false
org.gradle.caching=true

# Network: 较短超时 + 多次重试，避免单个连接卡死导致"假死"
systemProp.org.gradle.internal.http.socketTimeout=30000
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.repository.max.retries=50
systemProp.org.gradle.internal.repository.initial.backoff=500

# Fabric Properties
minecraft_version=1.20.1
loader_version=0.19.5
fabric_version=0.92.2+1.20.1

# Mod Properties
mod_version=0.1.0
maven_group=dev.stellarcraft
archives_base_name=stellarcraft
